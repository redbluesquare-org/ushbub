name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ushbub-store/package-lock.json

      - name: Install frontend dependencies
        working-directory: ushbub-store
        run: npm ci

      - name: Build frontend
        working-directory: ushbub-store
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .

      - name: Smoke test backend
        working-directory: backend
        run: |
          python - <<'PY'
          import app
          print(app.app.url_map)
          PY

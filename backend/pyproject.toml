[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ushbub-backend"
version = "0.1.0"
description = "Flask API backend for the Ushbub storefront"
requires-python = ">=3.11"
dependencies = [
  "Flask==2.2.5",
  "flask-api==3.1",
  "flask-cors==6.0.5",
  "Flask-RESTful==0.3.10",
  "Werkzeug==2.2.3",
]

[tool.setuptools]
py-modules = ["app"]
